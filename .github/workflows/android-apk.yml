name: Gerar APK BRUTO AI

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Criar estrutura Android
        run: |
          flutter create \
            --platforms=android \
            --project-name bruto_ai \
            .

      - name: Restaurar código do aplicativo
        run: |
          git checkout -- lib/main.dart pubspec.yaml test/widget_test.dart

      - name: Adicionar permissão de internet
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i \
              's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' \
              "$MANIFEST"
          fi

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Renomear APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/BRUTO-AI.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: BRUTO-AI-APK
          path: build/app/outputs/flutter-apk/BRUTO-AI.apk
          if-no-files-found: error
